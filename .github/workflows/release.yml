name: release

# Push a tag like v1.2.0 to build self-contained binaries and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build MotorBench.sln -warnaserror
      - run: dotnet test MotorBench.sln --no-build

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/MotorBench.Web -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:Version="$version" -o out/motorbench
          cp docs/deploy.md docs/web-hmi.md deploy/motorbench.service plc/bench_control.st out/motorbench/
          (cd out && zip -qr "../motorbench-$version-${{ matrix.rid }}.zip" motorbench)
      - uses: actions/upload-artifact@v4
        with:
          name: motorbench-${{ matrix.rid }}
          path: motorbench-*.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" motorbench-*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
