<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Bench Login</title>
<style>
  :root { --bg: #f4f5f7; --panel: #fff; --text: #1b1f24; --muted: #66707c; --line: #d9dde3; --run: #1f9d55; --fault: #d93025; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1e24; --text: #e6e9ed; --muted: #8b95a1; --line: #2c323a; --run: #34c776; --fault: #ff5a4f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  form { width: 100%; max-width: 320px; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  label { display: grid; gap: 4px; }
  input { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 9px; border: 0; border-radius: 6px; background: var(--run); color: #fff; font: inherit; cursor: pointer; }
  #msg { color: var(--fault); min-height: 1.4em; margin: 0; }
</style>
</head>
<body>
<form id="form">
  <h1>Motor Bench HMI</h1>
  <label>User name<input id="name" autocomplete="username" required autofocus></label>
  <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
  <button>Log in</button>
  <p id="msg" role="alert"></p>
</form>
<script>
let clientId;
try { clientId = sessionStorage.getItem('mb-client'); } catch {}
if (!clientId) { clientId = crypto.randomUUID(); try { sessionStorage.setItem('mb-client', clientId); } catch {} }

document.getElementById('form').onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-MotorBench-Client': clientId },
      body: JSON.stringify({ name: document.getElementById('name').value, password: document.getElementById('password').value }),
    });
    if (r.ok) { location.href = '/'; return; }
    msg.textContent = r.status === 429 ? 'Too many attempts. Wait a minute and try again.'
      : (await r.json().catch(() => null))?.detail ?? `Error ${r.status}`;
  } catch { msg.textContent = 'Server not reachable'; }
};
</script>
</body>
</html>
